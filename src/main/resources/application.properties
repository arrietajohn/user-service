spring.config.import=optional:file:.env[.properties],optional:file:.environments/application-secrets.properties

# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}
# DataSource se configura manualmente con las claves db.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:}
db.port=${DB_PORT:}
db.name=${DB_NAME:}
db.username=${DB_USERNAME:}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:}

# =============================================
# Publicacion de eventos en el exchange existente de RabbitMQ
# =============================================
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
rabbitmq.domain.exchange=${RABBITMQ_DOMAIN_EXCHANGE:}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

